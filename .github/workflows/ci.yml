name: Verify Folio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build-storybook
      - run: npm pack
      - run: node scripts/smoke-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: folio-package-and-storybook
          path: |
            *.tgz
            storybook-static/
